{% extends "base.html" %}
{% block title %}Confirm deletion{% endblock %}
{% block content %}
<div class="form-shell mx-auto"><div class="feature-icon danger-icon mb-3"><i class="bi bi-exclamation-lg" aria-hidden="true"></i></div><p class="eyebrow mb-2">CONFIRM ACTION</p><h1 class="h2 fw-bold">Delete this record?</h1><p class="text-secondary">You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
    <form method="post" class="d-flex gap-2 mt-4">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, delete</button>{% if cancel_pk %}<a class="btn btn-outline-secondary" href="{% url cancel_url cancel_pk %}">Cancel</a>{% else %}<a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancel</a>{% endif %}</form>
</div>
{% endblock %}
