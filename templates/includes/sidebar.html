<div class="app-sidebar" id="appSidebar">
    <div class="sidebar-identity">
        <span class="sidebar-avatar"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
        <span class="sidebar-user-copy">
            <strong>{{ user.get_full_name|default:user.username }}</strong>
            <small>{{ user.get_role_display }}</small>
        </span>
    </div>
    <p class="sidebar-label">ACCOUNT</p>
    <nav class="sidebar-nav" aria-label="Account navigation">
        {% if user.role == "ADMINISTRATOR" %}
            <a class="sidebar-link{% if request.resolver_match.url_name == 'admin_dashboard' %} active{% endif %}" href="{% url 'accounts:admin_dashboard' %}"{% if request.resolver_match.url_name == 'admin_dashboard' %} aria-current="page"{% endif %}>
                <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Administrator dashboard</span>
            </a>
        {% else %}
            <a class="sidebar-link{% if request.resolver_match.url_name == 'driver_dashboard' %} active{% endif %}" href="{% url 'accounts:driver_dashboard' %}"{% if request.resolver_match.url_name == 'driver_dashboard' %} aria-current="page"{% endif %}>
                <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Driver dashboard</span>
            </a>
            <a class="sidebar-link{% if request.resolver_match.namespace == 'vehicles' %} active{% endif %}" href="{% url 'vehicles:list' %}"{% if request.resolver_match.namespace == 'vehicles' %} aria-current="page"{% endif %}>
                <i class="bi bi-car-front" aria-hidden="true"></i><span>My vehicles</span>
            </a>
        {% endif %}
        <a class="sidebar-link{% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'edit_profile' %} active{% endif %}" href="{% url 'accounts:profile' %}"{% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'edit_profile' %} aria-current="page"{% endif %}>
            <i class="bi bi-person" aria-hidden="true"></i><span>My profile</span>
        </a>
    </nav>
</div>
